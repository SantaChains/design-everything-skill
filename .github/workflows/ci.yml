name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Build knowledge base
      run: uv run python scripts/build_db.py

    - name: Smoke: module list
      run: uv run python scripts/design.py list

    - name: Smoke: CJK search
      run: uv run python scripts/design.py search "按钮" --module ui --limit 1

    - name: Smoke: contrast against known WCAG value
      run: uv run python scripts/design.py contrast "#0052CC" "#FFFFFF" | grep -q "AA(正文)=pass"

    - name: Smoke: gate rejects empty template
      run: |
        uv run python scripts/design.py init --out /tmp/brief.json
        if uv run python scripts/design.py gate /tmp/brief.json --up-to propose; then
          echo "gate 应拒绝空模板"
          exit 1
        fi
